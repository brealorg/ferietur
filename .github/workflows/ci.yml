name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle distribution and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ferietur01/gradle
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('tools/gradle.sh', '**/*.gradle.kts', 'gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Verify source checksum manifest
        run: bash tools/verify-source-sha256.sh

      - name: Unit tests, lint and minified release build
        run: >
          bash tools/gradle.sh --dependency-verification=strict
          testDebugUnitTest lintRelease assembleRelease

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
