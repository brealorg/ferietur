name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle distribution and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ferietur01/gradle
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('tools/gradle.sh', '**/*.gradle.kts', 'gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install ripgrep (used by the source contracts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      # CI02: the source gates rotted once because nothing executed them. Run them on every push.
      - name: Source gates
        run: |
          bash tools/source-smoke.sh
          bash tools/gate01-contract.sh

      - name: Unit tests, lint and minified release build
        run: >
          bash tools/gradle.sh --dependency-verification=strict
          testDebugUnitTest lintRelease assembleRelease

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore

  instrumented:
    # CI03: the stand-alone on-device contract suites. The *StateTest classes are milestone
    # upgrade proofs that need a staged install sequence and are intentionally not run here.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle distribution and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ferietur01/gradle
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('tools/gradle.sh', '**/*.gradle.kts', 'gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on-device contract tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: >
            bash tools/gradle.sh --dependency-verification=strict connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=app.ferietur.RuntimeContractsTest,app.ferietur.UxFix01RuntimeTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore
